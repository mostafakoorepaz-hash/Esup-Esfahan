name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev \
            zlib1g-dev libssl-dev openssl libffi-dev libgdbm-dev libshare-dev \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            cmake libncurses5-dev libncursesw5-dev libtinfo5

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install --upgrade buildozer cython==0.29.33

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsfahanMap-APK
          path: bin/*.apk
